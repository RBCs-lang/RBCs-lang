name: Generate Contribution Snake Animation

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: RBCs-lang
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#10B981&color_dots=#2D3343,#065F46,#047857,#059669,#10B981
            dist/github-contribution-grid-snake-dark.svg?color_snake=#22D3EE&color_dots=#2D3343,#065F46,#047857,#059669,#10B981

      - name: Push github-contribution-grid-snake.svg to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
