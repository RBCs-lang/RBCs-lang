name: Generate Streak Stats SVG

on:
  schedule:
    # Run every 12 hours
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch streak stats SVG
        run: |
          curl -sSL \
            "https://streak-stats.demolab.com/?user=RBCs-lang&theme=dark&background=0A101F&stroke=22D3EE&dates=94A3B8&ring=22D3EE&fire=10B981&currStreakLabel=22D3EE&sideLabels=22D3EE&hide_border=true" \
            -o assets/streak-dark.svg
          curl -sSL \
            "https://streak-stats.demolab.com/?user=RBCs-lang&theme=default&background=F8FAFC&stroke=0891B2&dates=64748B&ring=0891B2&fire=10B981&currStreakLabel=0891B2&sideLabels=0891B2&hide_border=true" \
            -o assets/streak-light.svg

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/streak-dark.svg assets/streak-light.svg
          git diff --staged --quiet || git commit -m "chore: update streak stats SVG [skip ci]"
          git push
